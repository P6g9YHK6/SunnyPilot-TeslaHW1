name: sunnypilot prebuilt action

env:
  BUILD_DIR: ${{ (github.ref_name == 'dev' || github.ref_name == 'master') && format('{0}/build', github.workspace) || '/data/openpilot' }}
  OUTPUT_DIR: ${{ github.workspace }}/output
  CI_DIR: ${{ github.workspace }}/release/ci
  SCONS_CACHE_DIR: ${{ github.workspace }}/release/ci/scons_cache
  PUBLIC_REPO_URL: "${{ github.server_url }}/${{ github.repository }}"

  # Branch configurations
  STAGING_SOURCE_BRANCH: 'master'

  # Runtime configuration
  SOURCE_BRANCH: "${{ github.head_ref || github.ref_name }}"

on:
  push:
    branches: [ master, dev, master-dev ]
    tags: [ 'release/*' ]
  pull_request_target:
    types: [ labeled ]
  workflow_dispatch:
    inputs:
      wait_for_tests:
        description: 'Wait for tests to finish'
        required: false
        type: boolean
        default: false

jobs:
  prepare_strategy:
    runs-on: ubuntu-24.04
    if: (!contains(github.event_name, 'pull_request') || (github.event.action == 'labeled' && github.event.label.name == 'prebuilt'))
    outputs:
      environment: ${{ steps.strategy.outputs.environment }}
      new_branch: ${{ steps.strategy.outputs.new_branch }}
      extra_version_identifier: ${{ steps.strategy.outputs.extra_version_identifier }}
      version: ${{ steps.strategy.outputs.version }}
      cancel_publish_in_progress: ${{ steps.strategy.outputs.cancel_publish_in_progress }}
      publish_concurrency_group: ${{ steps.strategy.outputs.publish_concurrency_group }}
      is_stable_branch: ${{ steps.strategy.outputs.is_stable_branch }}
      build: ${{ steps.strategy.outputs.build }}
      include_big_model: ${{ steps.strategy.outputs.include_big_model }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract deploy strategy
        id: strategy
        run: |
          echo '::group::Strategy Extraction'
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Current branch: $BRANCH"

          STRATEGY_JSON='${{ vars.DEPLOY_STRATEGY }}'
          CONFIG=$(echo "$STRATEGY_JSON" | jq -r --arg branch "$BRANCH" '
            .configs[] | select(.branch == $branch)
          ')

          BUILD="$(date '+%Y.%m.%d')-${{ github.run_number }}"
          if [[ -z "$CONFIG" || "$CONFIG" == "null" ]]; then
            echo "No exact strategy match found. Falling back to feature/fork logic."
            IS_FORK="${{ github.event.pull_request.head.repo.fork && 'true' || 'false' }}"
            FORK_SUFFIX=$( [[ "$IS_FORK" == "true" ]] && echo "-fork" || echo "" )
            NEW_BRANCH="${BRANCH}${FORK_SUFFIX}-prebuilt"

            echo "new_branch=$NEW_BRANCH" >> $GITHUB_OUTPUT
            echo "version=$BUILD" >> $GITHUB_OUTPUT
            echo "cancel_publish_in_progress=true" >> $GITHUB_OUTPUT
            echo "publish_concurrency_group=publish-${BRANCH}" >> $GITHUB_OUTPUT
            echo "environment=feature-branch" >> $GITHUB_OUTPUT
            echo "extra_version_identifier=feature-branch" >> $GITHUB_OUTPUT
          else
          echo "Matched config: $CONFIG"
            environment=$(echo "$CONFIG" | jq -r '.environment')
            echo "environment=$environment" >> $GITHUB_OUTPUT
            echo "new_branch=$(echo "$CONFIG" | jq -r '.target_branch')" >> $GITHUB_OUTPUT
            cancel="$(echo "$CONFIG" | jq -r '.cancel_publish_in_progress')";
            echo "cancel_publish_in_progress=$( [ "$cancel" = "null" ] && echo "true" || echo $cancel)" >> $GITHUB_OUTPUT
            echo "publish_concurrency_group=publish-${BRANCH}$( [ "$cancel" = "null" ] || [ "$cancel" = "true" ] || echo "${{ github.sha }}" )" >> $GITHUB_OUTPUT

            is_stable_branch="$(echo "$CONFIG" | jq -r '.stable_branch // false')";
            echo "is_stable_branch=$is_stable_branch" >> $GITHUB_OUTPUT

            stable_version=$(cat openpilot/sunnypilot/common/version.h | grep SUNNYPILOT_VERSION | sed -e 's/[^0-9|.]//g');
            echo "version=$([ "$is_stable_branch" = "true" ] && echo "$stable_version" || echo "$BUILD")" >> $GITHUB_OUTPUT
            echo "extra_version_identifier=${environment}" >> $GITHUB_OUTPUT

            include_big_model="$(echo "$CONFIG" | jq -r '.include_big_model // false')";
            echo "include_big_model=$include_big_model" >> $GITHUB_OUTPUT
          fi
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  validate_tests:
    runs-on: ubuntu-24.04
    needs: [ prepare_strategy ]
    if: ${{
      ((github.event_name == 'workflow_dispatch' && inputs.wait_for_tests) ||
      (github.event_name == 'push' && needs.prepare_strategy.outputs.is_stable_branch == 'true') ||
      contains(github.event_name, 'pull_request') && (github.event.action == 'labeled' && github.event.label.name == 'prebuilt'))
      }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Tests
        uses: ./.github/workflows/wait-for-action # Path to where you place the action
        with:
          workflow: tests.yaml # The workflow file to monitor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          should-wait-for-start: ${{ github.event_name == 'push' && 'true' || 'false' }}

  build:
    needs: [ validate_tests, prepare_strategy ]
    concurrency:
      group: build-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    runs-on: ${{ (github.ref_name == 'dev' || github.ref_name == 'master') && 'ubuntu-24.04-arm' || '[self-hosted, linux]' }}
    outputs:
      new_branch: ${{ needs.prepare_strategy.outputs.new_branch }}
      version: ${{ needs.prepare_strategy.outputs.version }}
      extra_version_identifier: ${{ needs.prepare_strategy.outputs.extra_version_identifier }}
      commit_sha: ${{ github.sha }}
    if: ${{
      (always() && !cancelled() && !failure()) &&
      needs.prepare_strategy.result == 'success' &&
      (needs.validate_tests.result == 'success' || needs.validate_tests.result == 'skipped') &&
      (!contains(github.event_name, 'pull_request') ||
      (github.event.action == 'labeled' && github.event.label.name == 'prebuilt'))
      }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.SOURCE_BRANCH }}
          repository: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.full_name || github.repository }}
      - run: git lfs pull

      - name: Install dependencies (cloud runner)
        if: ${{ github.ref_name == 'dev' || github.ref_name == 'master' }}
        run: ./tools/op.sh setup

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: ${{env.SCONS_CACHE_DIR}}
          key: scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ github.sha }}
          # Note: GitHub Actions enforces cache isolation between different build sources (PR builds, workflow dispatches, etc.)
          #   for security. Only caches from the default branch are shared across all builds. This is by design and cannot be overridden.
          restore-keys: |
            scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}
            scons-${{ runner.os }}-${{ runner.arch }}-${{ env.STAGING_SOURCE_BRANCH }}
            scons-${{ runner.os }}-${{ runner.arch }}

      - name: Set environment variables
        id: set-env
        run: |
          echo "new_branch=${{ needs.prepare_strategy.outputs.new_branch }}" >> $GITHUB_OUTPUT
          echo "version=${{ needs.prepare_strategy.outputs.version }}" >> $GITHUB_OUTPUT
          echo "extra_version_identifier=${{ needs.prepare_strategy.outputs.extra_version_identifier }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

          # Set up common environment
          source /etc/profile;
          export UV_PROJECT_ENVIRONMENT=${HOME}/venv
          export VIRTUAL_ENV=$UV_PROJECT_ENVIRONMENT
          printenv >> $GITHUB_ENV
          if [[ "${{ runner.debug }}" == "1" ]]; then
            cat $GITHUB_OUTPUT
          fi

      - name: Setup build environment
        run: |
          mkdir -p "${BUILD_DIR}/"
          sudo find $BUILD_DIR/ -mindepth 1 -delete
          echo "Starting build stage..."
          echo "BUILD_DIR: ${BUILD_DIR}"
          echo "CI_DIR: ${CI_DIR}"
          echo "VERSION: ${{ steps.set-env.outputs.version }}"
          echo "UV_PROJECT_ENVIRONMENT: ${UV_PROJECT_ENVIRONMENT}"
          echo "VIRTUAL_ENV: ${VIRTUAL_ENV}"
          echo "-------"
          if [[ "${{ runner.debug }}" == "1" ]]; then
            printenv
          fi
          if [[ "${{ github.ref_name }}" != "dev" && "${{ github.ref_name }}" != "master" ]]; then
            PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --disable
          fi

      - name: Provision camerad build headers (CI-only)
        run: |
          # This job cross-builds the official mici/Tesla-HW1 device release.
          # /AGNOS only exists on real AGNOS hardware, never on this runner, so
          # SConstruct's COMMA_HARDWARE detection (which gates camerad's build)
          # needs this nudge or it silently skips building it entirely.
          sudo touch /AGNOS

          # camerad's #include "media/*.h" quoted includes fall back to the
          # system include path (/usr/include) - present on real AGNOS
          # hardware, not on this runner. These are just Qualcomm UAPI struct/
          # ioctl definitions (no vendor .so is linked), so it's safe to drop
          # in the last version of them this repo's history ever had, from
          # right before upstream removed the in-tree copies in favor of
          # relying on /usr (commaai/openpilot@d7c562e13, "use linux headers
          # from /usr"). Fetched at build time, not committed to the repo.
          # Restore every header that's reachable from system/camerad's own
          # #include directives (checked via `grep -rhoE '#include [<"](media/...' system/camerad/`),
          # plus the ones they cross-include internally (e.g. cam_isp.h ->
          # cam_isp_vfe.h, msm_cam_sensor.h -> msm_camsensor_sdk.h). Note the
          # old vendored tree kept msm_*.h flat under include/, but current
          # source does `#include <media/msm_camsensor_sdk.h>` - it must go
          # under media/ now to match, regardless of where it lived before.
          HEADER_SHA=f87bc52405e35a0b467d9cc460915fde63d6ba08
          sudo mkdir -p /usr/include/media
          git fetch --depth 1 origin "$HEADER_SHA"
          for f in cam_cpas.h cam_defs.h cam_fd.h cam_icp.h cam_isp.h cam_isp_ife.h cam_isp_vfe.h \
                   cam_jpeg.h cam_lrme.h cam_req_mgr.h cam_sensor.h cam_sensor_cmn_header.h cam_sync.h; do
            git show "$HEADER_SHA:third_party/linux/include/media/$f" | sudo tee "/usr/include/media/$f" > /dev/null
          done
          git show "$HEADER_SHA:third_party/linux/include/msm_camsensor_sdk.h" | sudo tee /usr/include/media/msm_camsensor_sdk.h > /dev/null
          # loggerd's v4l_encoder.cc also needs this one (`#include <media/msm_media_info.h>`).
          git show "$HEADER_SHA:third_party/linux/include/msm_media_info.h" | sudo tee /usr/include/media/msm_media_info.h > /dev/null

          # msgq_repo/SConscript picks visionbuf_ion.cc vs visionbuf.cc based on
          # `File('/dev/ion').exists()` - a BUILD-machine check, even though the
          # answer only matters for the TARGET device (which always has /dev/ion;
          # confirmed present on the real hardware). Without this, the build
          # silently links the non-ion fallback into camerad, which then fails
          # at runtime with `CAM_REQ_MGR_MAP_BUF ... errno 22 (EINVAL)` trying
          # to map its buffers into the ISP - a real device only surfaces this
          # once camerad can actually start, which it couldn't until now.
          # A plain empty file satisfies the existence check; nothing opens or
          # reads /dev/ion at build time, only at runtime on the real device.
          sudo touch /dev/ion
          git show "$HEADER_SHA:third_party/linux/include/linux/ion.h" | sudo tee /usr/include/linux/ion.h > /dev/null
          git show "$HEADER_SHA:third_party/linux/include/msm_ion.h" | sudo tee /usr/include/linux/msm_ion.h > /dev/null

          # loggerd's v4l_encoder.cc also needs Qualcomm's V4L2_CID_MPEG_VIDC_*
          # vendor control-ID extensions, which live in a patched linux/v4l2-controls.h.
          # This one was NEVER vendored in this repo's own git history (only ever
          # provided by AGNOS's OS image) - pull the identical file (verified same
          # size/content as the real device) from comma's own public kernel source
          # for this SoC instead, pinned to a fixed commit for reproducibility.
          KERNEL_SHA=967fbc05094a22ee431735c69f33f8b4ecbe51c9
          curl -sfL "https://raw.githubusercontent.com/commaai/agnos-kernel-sdm845/$KERNEL_SHA/include/uapi/linux/v4l2-controls.h" \
            | sudo tee /usr/include/linux/v4l2-controls.h > /dev/null

      - name: Provision font-rendering libs (CI-only)
        run: |
          # selfdrive/assets/fonts/process.py imports pyray to rasterize the
          # .fnt assets during the scons build. pyray's raylib backend dlopens
          # libGLESv2 at import time (even though nothing actually renders to
          # a screen here) - present on the desktop-flavored ubuntu-24.04
          # hosted runners, but not on this bare ubuntu-24.04-arm one, so the
          # import fails and takes the whole build down with it.
          sudo apt-get install -y --no-install-recommends libgles2 libegl1 >/dev/null 2>&1

      - name: Build Main Project
        run: |
          export PYTHONPATH="$BUILD_DIR"
          ./tools/release/release_files.py | xargs -0 cp -pR --parents -t "$BUILD_DIR" --
          cd $BUILD_DIR
          echo "Building sunnypilot's modeld_v2..."
          scons -j$(nproc) cache_dir=${{env.SCONS_CACHE_DIR}} --minimal openpilot/sunnypilot/modeld_v2
          echo "Building sunnypilot's locationd..."
          scons -j2 cache_dir=${{env.SCONS_CACHE_DIR}} --minimal openpilot/sunnypilot/selfdrive/locationd
          echo "Building openpilot's locationd..."
          scons -j1 cache_dir=${{env.SCONS_CACHE_DIR}} --minimal openpilot/selfdrive/locationd
          echo "Building rest of sunnypilot"
          scons -j$(nproc) cache_dir=${{env.SCONS_CACHE_DIR}} --minimal
          touch ${BUILD_DIR}/prebuilt
          if [[ "${{ runner.debug }}" == "1" ]]; then
            ls -la ${BUILD_DIR}
          fi

      - name: Replace CPU-compiled tinygrad models with real QCOM-compiled ones
        run: |
          # tinygrad model compilation (selfdrive/modeld/SConscript) picks its
          # backend via `Device.get_available_devices()` on the machine doing
          # the BUILD. This runner has no Qualcomm Adreno GPU, so it silently
          # falls back to DEV=CPU:LLVM, which compiles the model with whatever
          # ARM64 instructions this runner's CPU has - a real device's older
          # Kryo 385 cores can't execute all of them (SIGILL at runtime, no
          # stacktrace, since it's raw JIT-compiled code being executed).
          #
          # Same class of problem as the camera headers, different shape: this
          # one can't be fixed by providing a missing file, since it requires
          # actually talking to a real Adreno GPU (/dev/kgsl-3d0) to compile
          # against. Neither this pipeline nor any of this fork's other CI has
          # that. Upstream sunnypilot solves it with a self-hosted runner on
          # real tici hardware; StarPilot (another fork) explicitly skips
          # recompiling this one artifact in CI and sources it from a real
          # device instead (their SP_SKIP_DM_TINYGRAD_PKL) - same approach here.
          #
          # These were compiled directly on real mici hardware (confirmed
          # `Device.get_available_devices()` includes QCOM there) using the
          # exact flags/commands selfdrive/modeld/SConscript specifies, for
          # both driving and dmonitoring models plus both dm_warp resolutions.
          CACHE_SHA=b7f883939580cc8e026e14437c55ddb5bc4eb468
          git fetch --depth 1 origin "$CACHE_SHA"
          MODELS_DIR="${BUILD_DIR}/openpilot/selfdrive/modeld/models"
          for f in driving_tinygrad.pkl.chunkmanifest driving_tinygrad.pkl.chunk01of02 driving_tinygrad.pkl.chunk02of02 \
                   dmonitoring_model_tinygrad.pkl.chunkmanifest dmonitoring_model_tinygrad.pkl.chunk01of01 \
                   dm_warp_1344x760_tinygrad.pkl dm_warp_1928x1208_tinygrad.pkl tg_input_devices.json; do
            git show "$CACHE_SHA:$f" > "${MODELS_DIR}/$f"
          done

      - name: Fix locationd RUNPATH (CI-only)
        run: |
          # openpilot/sunnypilot/selfdrive/locationd/SConscript bakes Dir(...).abspath as the
          # RUNPATH, so a CI-built (prebuilt) locationd ends up with a runner-workspace
          # path that doesn't exist on the device (liblive.so => not found; locationd_llk
          # exits 127 and the manager reports it "not running"). Rewrite the RUNPATH to be
          # $ORIGIN-relative so it resolves from any install location (e.g. /data/openpilot).
          BIN="${BUILD_DIR}/openpilot/sunnypilot/selfdrive/locationd/locationd"
          if [ -f "$BIN" ]; then
            sudo apt-get install -y patchelf >/dev/null 2>&1
            patchelf --set-rpath '$ORIGIN/models/generated' "$BIN"
            readelf -d "$BIN" | grep -i 'runpath' || (echo "[locationd rpath] missing RUNPATH" && exit 1)
          else
            echo "[locationd rpath] ${BIN} not found, skipping" >&2
          fi

      - name: Verify build output
        run: |
          # Fails the build if any NativeProcess binary declared in process_config.py
          # is missing from the build output - so a build that silently drops a
          # required binary (wrong SConscript gating, missed arch, etc.) never
          # reaches a device. CI-only, not committed to the source tree.
          #
          # Statically parses process_config.py via `ast` instead of importing it:
          # importing it transitively runs module-level hardware/Params() side
          # effects (calibrationd.py's devicetree read, mapd_manager.py's Params())
          # that assume a real device and fail outright on this runner.
          sed 's/^          //' <<'PYEOF' | python3 - "$BUILD_DIR"
          import ast
          import os
          import sys

          build_dir = sys.argv[1]
          src_path = os.path.join(build_dir, "openpilot", "system", "manager", "process_config.py")
          tree = ast.parse(open(src_path).read(), filename=src_path)

          SCRIPT_INTERPRETERS = {"bash", "sh"}

          def native_process_calls(tree):
            for node in ast.walk(tree):
              if isinstance(node, ast.Call) and getattr(node.func, "id", None) == "NativeProcess":
                yield node

          def str_const(node):
            return node.value if isinstance(node, ast.Constant) and isinstance(node.value, str) else None

          missing = []
          checked = []
          for call in native_process_calls(tree):
            name = str_const(call.args[0])
            cwd = str_const(call.args[1])
            cmdline = call.args[2]
            if name is None or cwd is None or not isinstance(cmdline, ast.List) or not cmdline.elts:
              continue

            enabled_kw = next((kw.value for kw in call.keywords if kw.arg == "enabled"), None)
            if isinstance(enabled_kw, ast.Constant) and enabled_kw.value is False:
              continue  # only skip explicit `enabled=False`; anything else (incl. dynamic exprs) still gets checked

            exe = str_const(cmdline.elts[0])
            if exe is None or exe in SCRIPT_INTERPRETERS or exe.endswith((".py", ".sh")):
              continue

            path = os.path.normpath(os.path.join(build_dir, cwd, exe))
            checked.append(path)
            if not (os.path.isfile(path) and os.access(path, os.X_OK)):
              missing.append((name, path))

          print(f"[verify_binaries] checked {len(checked)} expected native binaries under {build_dir}")

          if missing:
            print("\n[verify_binaries] BUILD IS MISSING REQUIRED BINARIES:", file=sys.stderr)
            for name, path in missing:
              print(f"  - {name}: expected at {path}", file=sys.stderr)
            print(
              "\nThis release would silently ship without these processes. "
              "Check the SConstruct/SConscript gating for the platform this was built for.",
              file=sys.stderr,
            )
            sys.exit(1)

          print("[verify_binaries] all expected native binaries present.")
          PYEOF

      - name: Prepare Output
        run: |
          sudo rm -rf ${OUTPUT_DIR}
          mkdir -p ${OUTPUT_DIR}
          rsync -am${RUNNER_DEBUG:+v} \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.pyc' \
            --exclude='moc_*' \
            --exclude='__pycache__' \
            --exclude='Jenkinsfile' \
            --exclude='**/release/' \
            --exclude='**/tools/release/' \
            --exclude='**/.github/' \
            --exclude='**/selfdrive/ui/replay/' \
            --exclude='**/__pycache__/' \
            --exclude='${{env.SCONS_CACHE_DIR}}' \
            --exclude='**/.git/' \
            --exclude='**/SConstruct' \
            --exclude='**/SConscript' \
            --exclude='**/.venv/' \
            --exclude='openpilot/selfdrive/modeld/models/*.onnx*' \
            --exclude='openpilot/sunnypilot/modeld*/models/*.onnx*' \
            --exclude='openpilot/third_party/*x86*' \
            --exclude='openpilot/third_party/*Darwin*' \
            --delete-excluded \
            ${{ (github.ref_name == 'dev' || github.ref_name == 'master') && '' || '--chown=comma:comma' }} \
            ${BUILD_DIR}/ ${OUTPUT_DIR}/

      - name: 'Tar.gz files'
        run: |
          tar czf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }} .
          ls -la prebuilt.tar.gz

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: prebuilt.tar.gz

      - name: Re-enable powersave
        if: ${{ always() && github.ref_name != 'dev' && github.ref_name != 'master' }}
        run: |
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --enable


  prepare_chestnut:
    needs: [ prepare_strategy ]
    runs-on: ubuntu-24.04
    if: ${{ needs.prepare_strategy.outputs.include_big_model == 'true' }}
    outputs:
      onnx_sha256: ${{ steps.resolve.outputs.onnx_sha256 }}
    env:
      HF_REPO: sunnypilot/sunnypilot_models_v1
      HF_DEFAULTS_PATH: models/defaults/big
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - run: git lfs pull -I "openpilot/selfdrive/modeld/models/big_driving_supercombo.onnx"

      - name: Check HF defaults and build if needed
        id: resolve
        run: |
          ACTUAL_ONNX_HASH=$(sha256sum "openpilot/selfdrive/modeld/models/big_driving_supercombo.onnx" | cut -d' ' -f1)
          echo "Repo ONNX hash: $ACTUAL_ONNX_HASH"
          echo "onnx_sha256=$ACTUAL_ONNX_HASH" >> $GITHUB_OUTPUT

          JSON_URL="https://huggingface.co/datasets/${HF_REPO}/resolve/main/${HF_DEFAULTS_PATH}/default_models.json"

          check_hash() {
            DEFAULTS=$(curl -fsSL "$JSON_URL" 2>/dev/null) || return 1
            BUNDLE=$(echo "$DEFAULTS" | jq --arg hash "$ACTUAL_ONNX_HASH" '.bundles[] | select(.onnx_sha256 == $hash)' 2>/dev/null)
            [ -n "$BUNDLE" ] && [ "$BUNDLE" != "null" ]
          }

          if check_hash; then
            echo "HF defaults match repo ONNX"
          else
            echo "No matching model on HF — triggering build"
            gh workflow run build-default-big-model.yaml --ref "${{ github.head_ref || github.ref_name }}"

            echo "Waiting for build to start..."
            sleep 120

            RUN_ID=$(gh run list --workflow=build-default-big-model.yaml --branch="${{ github.head_ref || github.ref_name }}" --limit=1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::Failed to find build-default-big-model run"
              exit 1
            fi

            echo "Waiting for run $RUN_ID..."
            gh run watch "$RUN_ID"

            CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion')
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::build-default-big-model failed: $CONCLUSION"
              exit 1
            fi

            if ! check_hash; then
              echo "::error::HF defaults still don't match after build"
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cancel run on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    concurrency:
      # We do a bit of a hack here to avoid canceling the publishing job if a new commit comes in while we're publishing by adding the sha to the group name.
      # This means that if multiple commits come in while we're publishing, they will be queued up and publish one after the other.
      # Otherwise, if a job is waiting to be published due to environment wait time, it would be canceled by a new commit and restart the wait time.
      group: ${{ needs.prepare_strategy.outputs.publish_concurrency_group }}
      cancel-in-progress: ${{ needs.prepare_strategy.outputs.cancel_publish_in_progress == 'true' }}
    if: ${{ (always() && !cancelled() && !failure()) && needs.build.result == 'success' && needs.prepare_strategy.result == 'success' && (!contains(github.event_name, 'pull_request') || (github.event.action == 'labeled' && github.event.label.name == 'prebuilt')) && (needs.prepare_strategy.outputs.include_big_model != 'true' || needs.prepare_chestnut.result == 'success') }}
    needs: [ build, prepare_strategy, prepare_chestnut ]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare_strategy.outputs.environment }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: prebuilt

      - name: Untar prebuilt
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          tar xzf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }}

      - name: Prepare chestnut output
        if: ${{ needs.prepare_chestnut.result == 'success' }}
        run: |
          mkdir -p "${{ github.workspace }}/chestnut_output"
          tar xzf prebuilt.tar.gz -C "${{ github.workspace }}/chestnut_output"

      - name: Download big model chunks from HF
        if: ${{ needs.prepare_chestnut.result == 'success' }}
        env:
          HF_REPO: sunnypilot/sunnypilot_models_v1
          HF_DEFAULTS_PATH: models/defaults/big
        run: |
          ONNX_HASH="${{ needs.prepare_chestnut.outputs.onnx_sha256 }}"
          JSON_URL="https://huggingface.co/datasets/${HF_REPO}/resolve/main/${HF_DEFAULTS_PATH}/default_models.json"
          DEFAULTS=$(curl -fsSL "$JSON_URL")
          BUNDLE=$(echo "$DEFAULTS" | jq --arg hash "$ONNX_HASH" '.bundles[] | select(.onnx_sha256 == $hash)')

          mkdir -p big_model_chunks
          ARTIFACT=$(echo "$BUNDLE" | jq -r '.models[0].artifact')
          BASE_URL=$(echo "$ARTIFACT" | jq -r '.download_uri.url' | sed 's|/[^/]*$||')
          NUM_CHUNKS=$(echo "$ARTIFACT" | jq -r '.chunks | length')

          CANONICAL="big_driving_tinygrad.pkl"
          echo "$ARTIFACT" | jq -r '.chunks[].file_name' | while read CHUNK_NAME; do
            CHUNK_IDX=$(echo "$CHUNK_NAME" | grep -oP 'chunk\K[0-9]+of[0-9]+')
            CANONICAL_CHUNK="${CANONICAL}.chunk${CHUNK_IDX}"
            ENCODED_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${BASE_URL}/${CHUNK_NAME}', safe=':/'))")
            echo "Downloading $CHUNK_NAME -> $CANONICAL_CHUNK"
            curl -fsSL -o "big_model_chunks/${CANONICAL_CHUNK}" "$ENCODED_URL"
          done

          echo "$NUM_CHUNKS" > "big_model_chunks/${CANONICAL}.chunkmanifest"

      - name: Inject big model into chestnut
        if: ${{ needs.prepare_chestnut.result == 'success' }}
        run: |
          cp big_model_chunks/* "${{ github.workspace }}/chestnut_output/openpilot/selfdrive/modeld/models/"

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Publish to Public Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '${{ toJSON(needs.build.outputs) }}'
          ls -la ${{ env.OUTPUT_DIR }}

          ${{ env.CI_DIR }}/publish.sh \
            "${{ github.workspace }}" \
            "${{ env.OUTPUT_DIR }}" \
            "${{ needs.build.outputs.new_branch }}" \
            "${{ needs.build.outputs.version }}" \
            "https://x-access-token:${{github.token}}@github.com/${{ github.repository }}.git" \
            "${{ needs.build.outputs.extra_version_identifier }}"

          echo ""
          echo "----   ℹ️ To update the list of branches that auto deploy prebuilts  -----"
          echo ""
          echo "1. Go to: ${{ github.server_url }}/${{ github.repository }}/settings/variables/actions/AUTO_DEPLOY_PREBUILT_BRANCHES"
          echo "2. Current value: ${{ vars.AUTO_DEPLOY_PREBUILT_BRANCHES }}"
          echo "3. Update as needed (JSON array with no spaces)"

      - name: Publish chestnut branch
        if: ${{ needs.prepare_chestnut.result == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHESTNUT_BRANCH="${{ needs.build.outputs.new_branch }}-chestnut"
          CHESTNUT_DIR="${{ github.workspace }}/chestnut_output"

          ${{ env.CI_DIR }}/publish.sh \
            "${{ github.workspace }}" \
            "$CHESTNUT_DIR" \
            "$CHESTNUT_BRANCH" \
            "${{ needs.build.outputs.version }}" \
            "https://x-access-token:${{github.token}}@github.com/${{ github.repository }}.git" \
            "${{ needs.build.outputs.extra_version_identifier }}"

      - name: Tag ${{ needs.prepare_strategy.outputs.environment }}
        if: ${{ needs.prepare_strategy.outputs.is_stable_branch == 'true' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')) }}
        run: |
            TAG="${{ needs.prepare_strategy.outputs.environment }}/${{ needs.prepare_strategy.outputs.version }}/${{ needs.prepare_strategy.outputs.build }}"
            git tag -f -a ${TAG} -m "${{ needs.prepare_strategy.outputs.environment }} @ ${{ needs.prepare_strategy.outputs.version }} of build ${{ needs.build.outputs.build }}."
            git push -f origin ${TAG}

  notify:
    needs:
    - prepare_strategy
    - build
    - publish
    - prepare_chestnut
    runs-on: ubuntu-24.04
    if: ${{ (always() && !cancelled() && !failure())
      && needs.publish.result == 'success'
      && (!contains(github.event_name, 'pull_request') || (github.event.action == 'labeled' && github.event.label.name == 'prebuilt'))
      && vars.DEV_FEEDBACK_NOTIFICATION_BRANCHES_V2 != ''
      && (fromJSON(vars.DEV_FEEDBACK_NOTIFICATION_BRANCHES_V2)[github.head_ref || github.ref_name] != null) }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare notification message
        id: message
        run: |
          TEMPLATE='${{ vars.DISCOURSE_GENERAL_UPDATE_NOTICE }}'
          export VERSION="${{ needs.prepare_strategy.outputs.version }}"
          export branch_name="${{ env.SOURCE_BRANCH }}"
          export new_branch="${{ needs.prepare_strategy.outputs.new_branch }}"
          export commit_sha="${{ github.sha }}"
          export commit_short_sha="${{ github.sha }}"
          export commit_short_sha="${commit_short_sha:0:7}"
          export extra_version_identifier="${{ needs.prepare_strategy.outputs.extra_version_identifier || github.run_number }}"
          export PUBLIC_REPO_URL="${{ env.PUBLIC_REPO_URL }}"
          export chestnut_branch="${{ needs.prepare_chestnut.result == 'success' && format('{0}-chestnut', needs.build.outputs.new_branch) || '' }}"

          MESSAGE=$(cat << 'EOF' | envsubst
          ${{ vars.DISCOURSE_GENERAL_UPDATE_NOTICE }}
          EOF
          )

          {
            echo 'content<<EOFMARKER'
            echo "$MESSAGE"
            echo 'EOFMARKER'
          } >> $GITHUB_OUTPUT
        shell: bash

      - name: Post to Discourse
        uses: ./.github/workflows/post-to-discourse
        with:
          discourse-url: ${{ vars.DISCOURSE_URL }}
          api-key: ${{ secrets.DISCOURSE_API_KEY }}
          api-username: "system"
          topic-id: ${{ fromJSON(vars.DEV_FEEDBACK_NOTIFICATION_BRANCHES_V2)[github.head_ref || github.ref_name].topic_id }}
          message: ${{ steps.message.outputs.content }}

  manage-pr-labels:
    name: Remove prebuilt label
    runs-on: ubuntu-latest
    if: (always() && contains(github.event_name, 'pull_request') && (github.event.action == 'labeled' && github.event.label.name == 'prebuilt'))
    env:
      LABEL: prebuilt
    steps:
      - name: Remove trust-fork-pr label if present
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: process.env.LABEL
            });

            console.log(`Removed '${process.env.LABEL}' label from PR #${prNumber}`);
